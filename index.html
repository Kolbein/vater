<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Vater</title>
<meta name="theme-color" content="#111318" />
<meta name="description" content="Et enkelt vater som bruker telefonens bevegelsessensorer." />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vater" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Vater</h1>
    </header>

    <section class="readout" aria-live="polite">
      <span id="tiltAngle" class="angle-value">0°</span>
      <span id="axisMode" class="angle-label">Vinkel · Flate</span>
    </section>

    <section class="level-wrap">
      <div id="level" class="level" role="button" aria-label="Trykk for å bytte målemetode">
        <div class="horizon-mask">
          <div id="horizonRoll" class="horizon-roll">
            <div class="sky"></div>
            <div class="ground"></div>
            <div class="horizon-line"></div>
          </div>
        </div>
      </div>
      <p class="tap-hint">Trykk for å bytte til kantmåling (nullstilles til posisjonen du holder da)</p>
    </section>

    <footer class="footer">
      <button id="enableBtn" class="primary-btn" hidden>Aktiver bevegelsessensorer</button>
      <p id="status" class="status"></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
