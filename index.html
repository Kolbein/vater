<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Bubble Level</title>
<meta name="theme-color" content="#111318" />
<meta name="description" content="A simple bubble level that uses your phone's motion sensors." />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Level" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Bubble Level</h1>
      <button id="calibrateBtn" class="icon-btn" title="Calibrate to current position">Calibrate</button>
    </header>

    <section class="readout" aria-live="polite">
      <div class="axis">
        <span class="axis-label">X</span>
        <span id="tiltX" class="axis-value">0.0°</span>
      </div>
      <div class="axis">
        <span class="axis-label">Y</span>
        <span id="tiltY" class="axis-value">0.0°</span>
      </div>
    </section>

    <section class="level-wrap">
      <div id="level" class="level">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="crosshair crosshair-h"></div>
        <div class="crosshair crosshair-v"></div>
        <div id="bubble" class="bubble"></div>
      </div>
    </section>

    <footer class="footer">
      <button id="enableBtn" class="primary-btn" hidden>Enable Motion Sensors</button>
      <p id="status" class="status"></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
